build:
  maxIssues: 0

complexity:

  LongMethod:
    active: true
    threshold: 60
    excludes: ['**/test/**']


  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSimpleWhenEntries: true

style:

  ReturnCount:
    active: true
    max: 5


  NewLineAtEndOfFile:
    active: true

  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreEnums: true
    ignoreAnnotation: true

naming:
  MatchingDeclarationName:
    active: true

  FunctionNaming:
    active: true
    excludes: ['**/test/**']

  # ELEGIDA — variables en camelCase, arrancando en minúscula.
  VariableNaming:
    active: true

  # ELEGIDA — clases en PascalCase. Cero violaciones, activa para que siga así.
  ClassNaming:
    active: true